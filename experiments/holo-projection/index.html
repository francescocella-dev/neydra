<!doctype html>
<html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://127.0.0.1:*; object-src 'none'; base-uri 'none'">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='10' fill='%2375dcff'/%3E%3C/svg%3E"><title>NEYDRA · Holo projection lab</title></head>
<body><header><div><strong>NEYDRA / HOLO</strong><span>Laboratorio 3D · resa olografica da approvare</span></div><output id="status" role="status">Caricamento GLB locale…</output></header>
<main><section id="stage" aria-label="Modello Holo 3D, trascina per ruotare e usa la rotella per zoomare"></section>
<aside aria-label="Controlli del prototipo">
<button id="demo">Demo completa</button><div class="row"><button id="appear">Appari</button><button id="dismiss">Scompari</button><button id="reverse">Inverti</button></div>
<label>Proiezione <input id="progress" type="range" min="0" max="1" step="0.01" value="1"><output id="percent">100%</output></label>
<label><input id="reduced" type="checkbox"> Riduci movimento</label><label><input id="neutral" type="checkbox"> Materiale neutro</label><label><input id="light" type="checkbox"> Sfondo chiaro</label>
<label><input id="markers" type="checkbox"> Marker dietro il volto</label><label><input id="iris" type="checkbox" checked> Iride di luce (prova)</label>
<div class="row"><button data-view="front">Frontale</button><button data-view="three-quarter">3/4</button><button data-view="profile">Profilo</button></div>
<label>Espressione di verifica<select id="pose"><option value="neutral">Neutra</option><option value="blinkLeft">Blink sinistro</option><option value="blinkRight">Blink destro</option><option value="blink">Blink entrambi</option><option value="open">Bocca aperta</option><option value="close">Chiusura su mandibola aperta</option><option value="pucker">Labbra raccolte</option><option value="funnel">Labbra arrotondate</option><option value="smile">Sorriso lieve</option><option value="gaze">Sguardo attento</option></select></label>
<label>Stato<select id="state"><option>idle</option><option>listening</option><option>processing</option><option>speaking</option><option>interrupted</option><option>error</option></select></label>
<button id="speech">Parlato simulato</button><button id="stop">Stop / interrompi</button>
<p>Nessun audio o microfono. I visemi sono simulati. Trascina il volto per ispezionarlo.</p>
</aside></main><footer><span id="caption">Il tuo Holo · asset originale, morph reali, prototipo locale</span><span id="metrics"></span></footer>
<script type="module" src="/src/main.ts"></script></body></html>
